workflows:
  ios-release-workflow:
    name: KNUE MoA iOS Release
    # iOS 빌드를 위해 코드매직의 Mac 환경(M2)을 사용
    instance_type: mac_mini_m2 
    
    integrations:
      app_store_connect: "KNUE KIM"
    
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.knue.knuemoa
    scripts:
      - name: Create or fetch iOS code signing files
        script: |
          app-store-connect fetch-signing-files "com.knue.knuemoa" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on macOS builder
        script: |
          xcode-project use-profiles
          
      - name: Get Flutter packages
        script: |
          flutter packages pub get
          
      - name: Build IPA for App Store
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
          
    artifacts:
      - build/ios/ipa/*.ipa # 완성된 앱 설치 파일
      - /tmp/xcodebuild_logs/*.log # 에러 확인용 로그
      
    publishing:
      app_store_connect:
        # 코드매직 UI에 연동해 둔 App Store Connect API 키를 자동으로 사용함
        auth: integration 
        submit_to_testflight: true # 빌드 성공 시 TestFlight로 자동 업로드